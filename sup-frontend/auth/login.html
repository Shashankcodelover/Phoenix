<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Phoenix</title>
  <meta name="description" content="Login to your Phoenix career acceleration dashboard.">
  <link rel="stylesheet" href="../phoenix.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: clamp(28px, 4vw, 40px);
      text-align: center;
      margin: 16px;
      animation: modalPop 0.5s ease forwards;
    }

    .auth-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 5vw, 2.6rem);
      font-weight: 700;
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      color: var(--text-secondary);
      font-size: 0.88rem;
      margin-bottom: 28px;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }

    .password-toggle {
      position: relative;
    }

    .password-toggle input {
      padding-right: 48px;
    }

    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      transition: color var(--transition-fast);
    }

    .password-toggle-btn:hover {
      color: var(--text-primary);
    }

    .auth-footer {
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .auth-footer a {
      font-weight: 600;
    }

    #message {
      color: var(--red);
      font-size: 0.85rem;
      margin-top: 14px;
      min-height: 1.2em;
    }
  </style>
</head>
<body class="theme-light-cyan">

  <canvas id="particles"></canvas>

  <div class="glass-card auth-card">
    <h1 class="auth-logo">PHOENIX</h1>
    <p class="auth-subtitle">Access Your Career Command Center</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-toggle">
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="password-toggle-btn" onclick="togglePassword()" aria-label="Toggle password visibility">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg">Login</button>
    </form>

    <p id="message"></p>

    <p class="auth-footer">
      Don't have an account? <a href="signup.html">Create one</a>
    </p>
  </div>

  <script src="../phoenix-core.js"></script>
  <script>
    Phoenix.init({ particles: true, particleCount: 60, auth: false, nav: false, theme: true, transitions: false });

    function togglePassword() {
      const input = document.getElementById('password');
      const btn = input.nextElementSibling;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }
  </script>
  <script src="auth.js"></script>
</body>
</html>
