services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0-alpine
    container_name: phoenix-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: phoenix-prep
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Backend API Service
  backend:
    build:
      context: ./sup-backend
      dockerfile: Dockerfile
    container_name: phoenix-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/phoenix-prep
      JWT_SECRET: phoenix_super_secret_jwt_key_2026
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
    driver: local
